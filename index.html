<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>S.U.P.E.R.N.O.V.A - Central Hub</title>
<style>
    body, html { margin: 0; padding: 0; background-color: #050510; color: #fff; font-family: monospace; overflow-x: hidden; }
    .bg-image { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); opacity: 0.15; z-index: -1; width: 60%; pointer-events: none; }
    #galaxy-cursor { position: fixed; width: 40px; height: 40px; border: 1px dashed #4d79ff; border-radius: 50%; pointer-events: none; transform: translate(-50%, -50%); animation: spin 2s linear infinite; z-index: 9999; box-shadow: 0 0 15px rgba(77, 121, 255, 0.5); }
    @keyframes spin { 100% { transform: translate(-50%, -50%) rotate(360deg); } }
    .container { padding: 40px; max-width: 800px; margin: auto; display: none; }
    #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
    input, button, textarea { background: rgba(0,0,0,0.8); border: 1px solid #4d79ff; color: #fff; padding: 10px; margin: 5px 0; width: 100%; font-family: monospace; box-sizing: border-box; }
    button { cursor: pointer; background: #0f172a; font-weight: bold; }
    button:hover { background: #4d79ff; color: #000; }
    .panel { border: 1px solid #333; padding: 20px; background: rgba(10,10,20,0.8); margin-bottom: 20px; }
    .warning { color: #ff3333; font-size: 0.9em; margin-top: 10px; }
    .success { color: #33ff77; font-size: 0.9em; margin-top: 10px; }
</style>
</head>
<body>
<img src="S.U.P.E.R.N.O.V.A.png" class="bg-image" alt="Background">
<div id="galaxy-cursor"></div>

<div id="login-screen">
    <h2>SYSTEM ACCESS</h2>
    <p>I guarantee that the registration is private and completely secure.</p>
    <div style="width: 300px;">
        <input type="text" id="username" placeholder="Enter ID">
        <button onclick="login()">LOGIN</button>
    </div>
</div>

<div id="main-content" class="container">
    <div class="panel">
        <h3>SYSTEM UPDATES</h3>
        <ul>
            <li>Upcoming Update: Arabic Language Support</li>
            <li>Upcoming Update: German Language Support</li>
        </ul>
    </div>

    <div class="panel">
        <h3>COOPERATION REQUEST</h3>
        <p>Discord Information & Request Details (English Only)</p>
        <input type="text" id="discord_id" placeholder="Discord Username#0000" oninput="enforceEnglish(this)">
        <textarea id="collab_reason" rows="4" placeholder="State your cooperation request strictly..." oninput="enforceEnglish(this); checkContent(this)"></textarea>
        <button id="submit_btn" onclick="submitRequest()">SUBMIT REQUEST</button>
        <div id="status_msg"></div>
    </div>
    
    <div class="panel" id="inbox-panel" style="display:none;">
        <h3>INBOX NOTIFICATIONS</h3>
        <div id="inbox-messages"></div>
    </div>
</div>

<script>
    const cursor = document.getElementById('galaxy-cursor');
    document.addEventListener('mousemove', (e) => {
        cursor.style.left = e.clientX + 'px';
        cursor.style.top = e.clientY + 'px';
    });

    if(localStorage.getItem('user_logged_in')) {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('main-content').style.display = 'block';
        checkInbox();
    }

    function login() {
        const user = document.getElementById('username').value;
        if(user.trim() !== "") {
            localStorage.setItem('user_logged_in', user);
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
            checkInbox();
        }
    }

    function enforceEnglish(field) {
        field.value = field.value.replace(/[^a-zA-Z0-9\s!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/g, '');
    }

    const badWords = ["noob", "idiot", "stupid", "dumb", "fool"]; 

    function checkContent(field) {
        let text = field.value.toLowerCase();
        let isBanned = badWords.some(word => text.includes(word));
        
        if(isBanned) {
            let blockUntil = Date.now() + (6 * 60 * 1000); 
            localStorage.setItem('block_time', blockUntil);
            field.value = "";
            applyBlock();
        }
    }

    function applyBlock() {
        let blockTime = localStorage.getItem('block_time');
        if(blockTime && Date.now() < blockTime) {
            document.getElementById('submit_btn').disabled = true;
            document.getElementById('discord_id').disabled = true;
            document.getElementById('collab_reason').disabled = true;
            document.getElementById('status_msg').innerHTML = "<span class='warning'>SECURITY TRIGGERED. ACCESS BLOCKED FOR 6 MINUTES.</span>";
            setTimeout(applyBlock, 1000);
        } else {
            document.getElementById('submit_btn').disabled = false;
            document.getElementById('discord_id').disabled = false;
            document.getElementById('collab_reason').disabled = false;
            document.getElementById('status_msg').innerHTML = "";
            localStorage.removeItem('block_time');
        }
    }
    applyBlock();

    function submitRequest() {
        let lastSubmit = localStorage.getItem('last_submit_time');
        if(lastSubmit && Date.now() < parseInt(lastSubmit) + (24 * 60 * 60 * 1000)) {
            document.getElementById('status_msg').innerHTML = "<span class='warning'>You must wait 24 hours before submitting another request.</span>";
            return;
        }

        let discord = document.getElementById('discord_id').value;
        let reason = document.getElementById('collab_reason').value;
        
        if(!discord || !reason) return;

        let requests = JSON.parse(localStorage.getItem('supernova_requests') || '[]');
        let newReq = { id: Date.now(), user: localStorage.getItem('user_logged_in'), discord: discord, reason: reason, status: 'pending' };
        requests.push(newReq);
        localStorage.setItem('supernova_requests', JSON.stringify(requests));
        localStorage.setItem('last_submit_time', Date.now());

        document.getElementById('discord_id').value = "";
        document.getElementById('collab_reason').value = "";
        document.getElementById('status_msg').innerHTML = "<span class='success'>Wait for your request, it will be in the accept/reject list. You will be notified if you return to the site. It may take up to two days. If not accepted or rejected, you can submit another request.</span>";
    }

    function checkInbox() {
        let responses = JSON.parse(localStorage.getItem('supernova_responses') || '[]');
        let user = localStorage.getItem('user_logged_in');
        let myResponses = responses.filter(r => r.user === user);
        
        if(myResponses.length > 0) {
            document.getElementById('inbox-panel').style.display = 'block';
            let html = "";
            myResponses.forEach(r => {
                let color = r.status === 'ACCEPTED' ? '#33ff77' : '#ff3333';
                html += `<div style="border-left: 3px solid ${color}; padding-left: 10px; margin-bottom: 10px;">
                            <strong>${r.status}</strong><br>${r.message}
                         </div>`;
            });
            document.getElementById('inbox-messages').innerHTML = html;
        }
    }
</script>
</body>
</html>
